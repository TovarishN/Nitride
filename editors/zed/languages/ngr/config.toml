name = "Nitride Grammar"
grammar = "nitride"
path_suffixes = ["ngr"]
line_comments = ["// "]
block_comment = ["/*", "*/"]
tab_size = 2
first_line_pattern = "^#!nitrogen\\s+grammar\\b"

brackets = [
  { start = "{", end = "}", close = true, newline = true },
  { start = "[", end = "]", close = true, newline = false },
  { start = "(", end = ")", close = true, newline = false },
  { start = "\"", end = "\"", close = true, newline = false, not_in = ["string", "comment"] },
  { start = "'", end = "'", close = true, newline = false, not_in = ["string", "comment"] },
]
