name: Production PGO
on:
  pull_request:
    paths:
      - '.github/workflows/pgo.yml'
      - 'scripts/build-pgo.mjs'
      - 'crates/nitride-cli/src/pgo.rs'
  workflow_dispatch:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: rustup toolchain install stable --profile minimal --component llvm-tools-preview
      - run: rustup default stable
      - run: node scripts/build-pgo.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: nitride-pgo-${{ matrix.os }}
          path: target/pgo/dist/
          if-no-files-found: error
