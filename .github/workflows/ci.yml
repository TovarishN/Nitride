name: Native Rust
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - name: Install stable Rust tools
        run: rustup toolchain install stable --profile minimal --component rustfmt --component clippy
      - run: cargo +stable fmt --all --check
      - run: cargo +stable test --workspace --locked
      - name: Test the editor's server build (no component runtime)
        run: cargo +stable test --locked -p nitride-cli --no-default-features
      - name: Verify grammar bootstrap fixed point
        run: cargo +stable run --locked -p nitride-prepare --example bootstrap -- --check
      - run: cargo +stable clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo +stable build --release --locked
      - run: cargo +stable run --release --locked -p nitride-cli --bin nitride -- languages/portable/sample.portable
      - run: cargo +stable run --release --locked -p nitride-cli --bin nitride -- --power languages/power/sample.powercalc
      - run: cargo +stable run --release --locked -p nitride-cli --bin nitride -- --parse-xml languages/xml/sample.xml
      - name: Prepare languages natively
        run: |
          for profile in portable power composition xml namespaces inference calls functions dates rewrites csharp4 grammar; do
            cargo +stable run --release --locked -p nitride-cli --bin nitride -- prepare "languages/$profile/project.json" --output "prepared-$profile.json"
          done
      - run: cargo +stable run --release --locked -p nitride-cli --bin nitride -- --namespaces languages/namespaces/sample.namespaces
      - run: cargo +stable run --release --locked -p nitride-cli --bin nitride -- --inference languages/inference/sample.inferred
      - run: cargo +stable run --release --locked -p nitride-cli --bin nitride -- --calls languages/calls/sample.calls
      - run: cargo +stable run --release --locked -p nitride-cli --bin nitride -- --functions languages/functions/sample.functions
      - run: cargo +stable run --release --locked -p nitride-cli --bin nitride -- --dates languages/dates/sample.dates --today 2026-10-24
      - run: cargo +stable run --release --locked -p nitride-cli --bin nitride -- --rewrites languages/rewrites/sample.rewrites --today 2026-10-24
      - run: cargo +stable run --release --locked -p nitride-cli --bin nitride -- --parse-csharp4 languages/csharp4/corpus/Mono2008/gtest-linq-01.cs
