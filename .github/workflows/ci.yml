name: Native Rust
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  release-tools:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: editors/vscode/package-lock.json
      - run: rustup toolchain install stable --profile minimal
      - run: python3 scripts/version.py check
      - working-directory: editors/vscode
        run: |
          npm ci
          npm run compile
          npm test
      - run: python3 -m unittest scripts/test_release.py
      - run: rustc --edition=2024 --test scripts/release/launcher.rs -o /tmp/nitride-launcher-test && /tmp/nitride-launcher-test

  quality:
    name: Quality and optional features
    runs-on: ubuntu-24.04
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - name: Install stable Rust quality tools
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt --component clippy
          rustup override set stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo +stable fmt --all --check
      - run: cargo +stable clippy --workspace --all-targets --all-features --locked -- -D warnings
      - name: Verify optional ASCII and SIMD scanners
        run: |
          cargo +stable test --locked -p nitride-core --features simd-ascii-runs
          cargo +stable test --locked -p nitride-cli --test native_lexers --test generated_syntax --features nitride-core/simd-ascii-runs
      - name: Verify grammar bootstrap fixed point
        run: cargo +stable run --locked -p nitride-prepare --example bootstrap -- --check

  native:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025, macos-15]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - name: Install stable Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup override set stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo +stable test --workspace --locked
      - name: Test native-only CLI, process bindings and LSP startup
        run: cargo +stable test --locked -p nitride-cli --no-default-features --test native_only --test process --test lsp_binary
