name: Native release

on:
  push:
    tags: ['v*.*.*']
    branches: ['codex/release-*']
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the selected tag after every target succeeds (branches only build artifacts)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: native-release-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

env:
  RUST_TOOLCHAIN: '1.99.1'

jobs:
  version:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate synchronized versions and tag
        env:
          RELEASE_REF_TYPE: ${{ github.ref_type }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if [[ "$RELEASE_REF_TYPE" == tag ]]; then
            python scripts/version.py check --tag "$RELEASE_TAG"
          else
            python scripts/version.py check
          fi
      - id: matrix
        run: python -c 'import json, os; m=json.load(open("scripts/release/matrix.json")); open(os.environ["GITHUB_OUTPUT"], "a").write("matrix="+json.dumps(m)+"\n")'

  native:
    needs: version
    name: ${{ matrix.id }} (PGO)
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.version.outputs.matrix) }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: editors/vscode/package-lock.json
      - name: Install pinned Rust and profiling tools
        if: ${{ !matrix.container }}
        env:
          RUST_TARGET: ${{ matrix.target }}
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component llvm-tools-preview --target "$RUST_TARGET"
          rustup override set "$RUST_TOOLCHAIN"
      - name: Install Linux post-link optimizer
        if: ${{ matrix.bolt }}
        run: |
          sudo apt-get update
          sudo apt-get install -y bolt-18 libbolt-18-dev
      - name: Test native CLI and server without Wasmtime
        if: ${{ !matrix.container }}
        run: cargo test --locked -p nitride-cli -p nitride-lsp --no-default-features
      - name: Build, train PGO, optimize and verify native binaries
        if: ${{ !matrix.container }}
        env:
          RELEASE_PLATFORM: ${{ matrix.id }}
        run: python scripts/release/build.py "$RELEASE_PLATFORM"
      - name: Enable ARMv7 container execution
        if: ${{ matrix.id == 'linux-armhf' }}
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm
      - name: Build and train Alpine or ARMv7 on its own userspace
        if: ${{ matrix.container }}
        env:
          RELEASE_PLATFORM: ${{ matrix.id }}
          RELEASE_CONTAINER: ${{ matrix.container }}
          RELEASE_DOCKER_PLATFORM: ${{ matrix.platform }}
        run: |
          docker run --rm --platform "$RELEASE_DOCKER_PLATFORM" \
            -v "$PWD:/work" -w /work \
            -e RELEASE_PLATFORM -e RUST_TOOLCHAIN \
            "$RELEASE_CONTAINER" sh -eu -c '
              if command -v apk >/dev/null; then
                apk add --no-cache python git build-base
              else
                apt-get update
                apt-get install -y python git binutils
              fi
              git config --global --add safe.directory /work
              rustup component add llvm-tools-preview
              cargo test --locked -p nitride-cli -p nitride-lsp --no-default-features
              python3 scripts/release/build.py "$RELEASE_PLATFORM"
            '
      - name: Compile and test extension
        working-directory: editors/vscode
        run: |
          npm ci
          npm run compile
          npm test
      - name: Package target-specific VSIX and CLI archive
        env:
          RELEASE_PLATFORM: ${{ matrix.id }}
        run: python scripts/release/package.py "$RELEASE_PLATFORM"
      - name: Upload verified release assets
        uses: actions/upload-artifact@v4
        with:
          name: native-${{ matrix.id }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14

  publish:
    needs: [version, native]
    if: ${{ startsWith(github.ref, 'refs/tags/v') && (github.event_name == 'push' || inputs.publish) }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          pattern: native-*
          merge-multiple: true
          path: dist
      - name: Verify all nine targets, archives, VSIXs and checksums
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python scripts/version.py check --tag "$RELEASE_TAG"
          python scripts/release/package.py verify
      - name: Create draft, upload assets and publish complete release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$RELEASE_TAG" --json isDraft > release-state.json 2>/dev/null; then
            python -c 'import json; assert json.load(open("release-state.json"))["isDraft"], "Refusing to overwrite a published release"'
          else
            gh release create "$RELEASE_TAG" --verify-tag --draft --generate-notes --title "Nitride $RELEASE_TAG"
          fi
          gh release upload "$RELEASE_TAG" dist/* --clobber
          gh release edit "$RELEASE_TAG" --draft=false
