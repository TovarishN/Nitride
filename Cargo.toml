[workspace]
members = ["crates/nitride-core", "crates/nitride-codegen", "crates/nitride-cli", "crates/nitride-prepare", "crates/nitride-lsp"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
rust-version = "1.85"

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"
