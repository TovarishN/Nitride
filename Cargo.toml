[workspace]
members = ["crates/nitride-core", "crates/nitride-codegen", "crates/nitride-cli", "crates/nitride-prepare", "crates/nitride-lsp", "crates/nitride-wasm", "crates/nitride-process"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
rust-version = "1.85"

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"

# Keep symbols until the post-link optimization stage has finished.
[profile.dist]
inherits = "release"
opt-level = 3
lto = "fat"
codegen-units = 1
strip = false
