[package]
name = "nitride-lsp"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
nitride-core = { path = "../nitride-core" }
nitride-prepare = { path = "../nitride-prepare" }
nitride-codegen = { path = "../nitride-codegen" }
nitride-wasm = { path = "../nitride-wasm", optional = true }
serde_json = "1"

[features]
default = ["components"]
# Inlay hints run operations bound to WebAssembly components, through wasmtime.
components = ["dep:nitride-wasm"]
