[package]
name = "nitride-cli"
autobins = false
default-run = "nitride"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[[bin]]
name = "nitride"
path = "src/main.rs"

[[bin]]
name = "nitride-profile"
path = "src/bin/profile.rs"

[dependencies]
nitride-prepare = { path = "../nitride-prepare" }
nitride-core = { path = "../nitride-core" }
nitride-lsp = { path = "../nitride-lsp" }
nitride-codegen = { path = "../nitride-codegen" }
nitride-wasm = { path = "../nitride-wasm", optional = true }
nitride-process = { path = "../nitride-process" }
serde_json = "1"

[build-dependencies]
nitride-prepare = { path = "../nitride-prepare" }
nitride-codegen = { path = "../nitride-codegen" }

[features]
default = ["components"]
# WebAssembly component bindings (`run`, `conform` and `binding draft` over
# `.nbind` components), through wasmtime. The editor's server leaves it out:
# scripts/package-vscode.sh builds with --no-default-features.
components = ["dep:nitride-wasm"]
# Compatibility with the feature name in the v0.1.0 release.
wasm = ["components"]
# Measure latency with the ordinary default allocator; allocator metrics are null.
uninstrumented-profiler = []
