[package]
name = "nitride-cli"
autobins = false
default-run = "nitride"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[[bin]]
name = "nitride"
path = "src/main.rs"

[[bin]]
name = "nitride-profile"
path = "src/bin/profile.rs"

[dependencies]
nitride-testing = { path = "../nitride-testing" }
nitride-prepare = { path = "../nitride-prepare" }
nitride-core = { path = "../nitride-core" }
nitride-lsp = { path = "../nitride-lsp", default-features = false }
nitride-codegen = { path = "../nitride-codegen" }
nitride-wasm = { path = "../nitride-wasm", optional = true }
nitride-process = { path = "../nitride-process" }
serde_json = "1"

[build-dependencies]
nitride-core = { path = "../nitride-core" }
nitride-prepare = { path = "../nitride-prepare" }
nitride-codegen = { path = "../nitride-codegen" }

[features]
default = ["components"]
# WebAssembly component bindings (`run`, `conform` and `binding draft` over
# `.nbind` components, and the server's inlay hints), through wasmtime. The
# editor's bundled server leaves it out: scripts/package-vscode.sh builds with
# --no-default-features. Point nitride.server.path at a default build for them.
components = ["dep:nitride-wasm", "nitride-lsp/components"]
# Compatibility with the feature name in the v0.1.0 release.
wasm = ["components"]
# Measure latency with the ordinary default allocator; allocator metrics are null.
uninstrumented-profiler = []
# `nitride-profile --census`: count parser decisions for the fast strict path census.
census = ["nitride-core/census"]
