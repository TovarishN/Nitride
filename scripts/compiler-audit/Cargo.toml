[package]
name = "nitride-compiler-audit"
version = "0.1.0"
edition = "2024"
publish = false

[workspace]

[dependencies]
nitride-core = { path = "../../crates/nitride-core" }
serde_json = "1"

[build-dependencies]
nitride-prepare = { path = "../../crates/nitride-prepare" }
nitride-codegen = { path = "../../crates/nitride-codegen" }

[profile.release]
lto = true
codegen-units = 1
panic = "abort"

